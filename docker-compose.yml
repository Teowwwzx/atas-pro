services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: atas_pro_chat_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atas_pro_chat}
      POSTGRES_USER: ${POSTGRES_USER:-atas_pro_chat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123123}
    volumes:
      - pro_chat_postgres_data:/var/lib/postgresql/data
    networks:
      - atas_pro_chat_network
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: atas_pro_chat_redis
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - pro_chat_redis_data:/data
    networks:
      - atas_pro_chat_network
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: atas_pro_chat_rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - atas_pro_chat_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atas_pro_chat_api
    env_file:
      - .env
    environment:
      # Override infrastructure URLs for Docker network (overrides .env localhost values)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-atas_pro_chat_user}:${POSTGRES_PASSWORD:-123123}@postgres:5432/${POSTGRES_DB:-atas_pro_chat}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - atas_pro_chat_network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atas_pro_chat_worker
    env_file:
      - .env
    environment:
      # Override infrastructure URLs for Docker network (overrides .env localhost values)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-atas_pro_chat_user}:${POSTGRES_PASSWORD:-123123}@postgres:5432/${POSTGRES_DB:-atas_pro_chat}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - atas_pro_chat_network
    restart: unless-stopped
    command: [ "celery", "-A", "app.core.celery_app.celery_app", "worker", "-l", "info", "--concurrency=2" ]

networks:
  atas_pro_chat_network:
    name: atas_pro_chat_network

volumes:
  pro_chat_postgres_data:
  pro_chat_redis_data:
